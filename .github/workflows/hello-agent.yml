name: Hello agent
on:
  push:
    branches: [main]
  pull_request:
    paths: ['recipes/hello-agent/**', '.github/workflows/hello-agent.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: recipes/hello-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: bash -n run.sh
